<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{DOMAIN_NAME}}</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #0f1117;
        color: #e2e8f0;
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        padding: 2rem;
      }

      .card {
        background: #1a1d2e;
        border: 1px solid #2a2d3e;
        border-radius: 16px;
        padding: 3rem 3.5rem;
        max-width: 520px;
        width: 100%;
        text-align: center;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      }

      .lock-icon {
        width: 56px;
        height: 56px;
        margin: 0 auto 1.5rem;
        background: linear-gradient(135deg, #22c55e, #16a34a);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .lock-icon svg {
        width: 28px;
        height: 28px;
        fill: #fff;
      }

      h1 {
        font-size: 2rem;
        font-weight: 700;
        color: #f1f5f9;
        margin-bottom: 0.75rem;
        letter-spacing: -0.5px;
      }

      .subtitle {
        font-size: 0.95rem;
        color: #64748b;
        margin-bottom: 2rem;
        line-height: 1.5;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        background: rgba(34, 197, 94, 0.1);
        border: 1px solid rgba(34, 197, 94, 0.25);
        color: #4ade80;
        padding: 0.35rem 0.85rem;
        border-radius: 20px;
        font-size: 0.82rem;
        font-weight: 500;
        margin-bottom: 2rem;
      }

      .badge .dot {
        width: 7px;
        height: 7px;
        background: #22c55e;
        border-radius: 50%;
        animation: pulse 2s infinite;
      }

      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50%      { opacity: 0.4; }
      }

      .domain {
        font-size: 0.82rem;
        color: #475569;
        font-family: 'SF Mono', 'Consolas', monospace;
      }

      .domain span {
        color: #94a3b8;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="lock-icon">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1s3.1 1.39 3.1 3.1v2z"/>
        </svg>
      </div>

      <h1>Hello, SSL!</h1>
      <p class="subtitle">Your server is running with a valid<br>Let's Encrypt certificate.</p>

      <div class="badge">
        <span class="dot"></span>
        Connection is secure
      </div>

      <div class="domain">
        <span>https://</span>{{DOMAIN_NAME}}
      </div>
    </div>
  </body>
</html>
